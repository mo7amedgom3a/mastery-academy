    <script>
      (function() {
        const theme = localStorage.getItem("ma-theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>ماستري اكاديمي - تعلم ما يغير عالمك</title>
    <style>
      :root {
        background-color: #0a0a0f;
      }
      :root[data-theme="light"] {
        background-color: #f5f2ec;
      }
      html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        background-color: #0a0a0f;
        color: #f0ede8;
      }
      html[data-theme="light"] body {
        background-color: #f5f2ec;
        color: #1a1714;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Cairo", system-ui, sans-serif;
        background-color: #0a0a0f;
        z-index: 9999;
      }
      html[data-theme="light"] .boot-splash {
        background-color: #f5f2ec;
      }
      .boot-splash .boot-logo {
        width: 240px;
        height: auto;
        max-width: 80vw;
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      .boot-splash .boot-sweep {
        animation: boot-sweep 1.6s ease-in-out infinite;
      }
      .boot-splash .loading-text {
        margin-top: 2.5rem;
        font-size: 1.15rem;
        letter-spacing: 0.1em;
        color: #FF6555;
        font-weight: 600;
        animation: loader-pulse 1.5s infinite;
        display: flex;
        gap: 3px;
        direction: rtl;
      }
      .boot-splash .loading-text span {
        animation: loader-blink 1.5s infinite;
        opacity: 0;
      }
      .boot-splash .loading-text span:nth-child(1) {
        animation-delay: 0.0s;
      }
      .boot-splash .loading-text span:nth-child(2) {
        animation-delay: 0.3s;
      }
      .boot-splash .loading-text span:nth-child(3) {
        animation-delay: 0.6s;
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-380px); }
        100% { transform: translateX(380px); }
      }
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes loader-blink {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
    </style>
